---
- name: Configure application servers
  hosts: app
  become: true

  tasks:
    - name: Create application directory
      file:
        path: /opt/app
        state: directory
        owner: ops
        group: ops
        mode: "0755"

    - name: Deploy application webpage
      template:
        src: ../templates/app-index.html.j2
        dest: /opt/app/index.html
        owner: ops
        group: ops
        mode: "0644"

    - name: Deploy application systemd service
      template:
        src: ../templates/production-app.service.j2
        dest: /etc/systemd/system/production-app.service
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Enable and start application service
      systemd:
        name: production-app
        state: started
        enabled: true
